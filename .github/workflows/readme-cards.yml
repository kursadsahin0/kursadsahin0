name: Refresh README cards

on:
  schedule:
    - cron: "0 5 * * *" # every morning, 08:00 Türkiye
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "data/portrait.txt", "fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contributions and profile numbers
        run: python scripts/fetch_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render README cards (hero, graph, activity, tiles, repos, stack)
        run: python scripts/render_cards.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
